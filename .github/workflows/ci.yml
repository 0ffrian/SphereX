name: ci

# The only CI entry point. Every PR gets one required check, `ci-gate`, which
# always reports, even when no checks were needed (docs-only PRs), and runs
# again in the merge queue on the PR combined with the latest main. backend.yml
# and frontend.yml run only when their paths change. Documented in docs/architecture/testing.md (A12).

on:
  pull_request:
  # The merge queue tests each PR on top of the latest main before merging it.
  merge_group:
  push:
    branches: [main]
  # Manual run of every check on any branch (Actions tab).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a newer push to the same PR cancels a run; runs on main finish, so main's history
  # shows each commit's real result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codeowners: ${{ steps.filter.outputs.codeowners }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -u
          # On a PR, HEAD is the merge commit and BASE the PR's base when it was last updated, so
          # files that changed on main since then can show up too. That only runs extra checks.
          # Fail safe: if the changed files can't be listed, run every check.
          if [ -z "$BASE" ] || ! files=$(git diff --name-only "$BASE" HEAD); then
            echo "Could not diff against '$BASE'; running all checks."
            { echo "backend=true"; echo "frontend=true"; echo "codeowners=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$files"
          has() { if grep -qE "$1" <<< "$files"; then echo true; else echo false; fi; }
          {
            # The backend checks also read frontend files: bake_demo_pack (search/demoTargets.ts,
            # viewer/altText.ts) and test_gas_giant_layers (viewer/renderers/shaderSpec.ts).
            echo "backend=$(has '^(backend/|shared/|frontend/src/viewer/|frontend/src/app/search/|\.github/workflows/|package\.json$)')"
            echo "frontend=$(has '^(frontend/|shared/|\.github/workflows/|package\.json$)')"
            echo "codeowners=$(has '^\.github/CODEOWNERS$')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  # Runs only on a PR that changes .github/CODEOWNERS (none exists on main yet); until then it is
  # always skipped, which ci-gate counts as passing.
  codeowners:
    name: CODEOWNERS has no errors
    needs: changes
    if: needs.changes.outputs.codeowners == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # The PR merge commit lives in this repo, fork PRs included.
          URL: repos/${{ github.repository }}/codeowners/errors?ref=${{ github.sha }}
        run: |
          # 404 means the PR deletes .github/CODEOWNERS; fail with a clear message.
          out=$(gh api "$URL") || { echo "::error::Could not read CODEOWNERS errors (was the file deleted?)"; exit 1; }
          echo "$out"
          [ "$(jq '.errors | length' <<< "$out")" = 0 ]

  gate:
    name: ci-gate
    needs: [changes, backend, frontend, codeowners]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` must succeed; every other job must be success or skipped.
          jq -e '.changes.result == "success"' <<< "$NEEDS" > /dev/null || { echo "changes job did not succeed"; exit 1; }
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' <<< "$NEEDS" > /dev/null || { echo "a required job failed or was cancelled"; exit 1; }
          echo "ci-gate passed"
