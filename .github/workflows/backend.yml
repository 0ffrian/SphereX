name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: ruff, mypy, pytest (offline)
    runs-on: ubuntu-latest
    env:
      # Tests never touch the network: recorded cache entries only (A12, D-25).
      SX_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python -m scripts.generate_contract --check
      - run: uv run python -m scripts.bake_fixtures --check
      - run: uv run python -m scripts.area_fixtures --check
      # Q-164: no D-25 cache here, so this re-checks stage 7, the maps and the list from the
      # committed cards. `--strict` (catalogues from the cache) runs on the bake machine.
      - run: uv run python -m scripts.bake_demo_pack --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
