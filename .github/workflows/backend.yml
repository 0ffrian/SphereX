name: backend

# Called by ci.yml, which decides when this runs (path filter) and
# reports the single required check, ci-gate.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: ruff, mypy, pytest (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Tests never touch the network: recorded cache entries only (A12, D-25).
      SX_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python -m scripts.generate_contract --check
      - run: uv run python -m scripts.bake_fixtures --check
      - run: uv run python -m scripts.area_fixtures --check
      # Q-164: no D-25 cache here, so this re-checks stage 7, the maps and the list from the
      # committed cards. `--strict` (catalogues from the cache) runs on the bake machine.
      - run: uv run python -m scripts.bake_demo_pack --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
