<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound check (dev only)</title>
    <!-- SX_DEV_ONLY_SOUND_CHECK: R13.9 stage sound check (#116). Not an input of the production build. -->
    <style>
      body {
        margin: 1rem;
        background: #111;
        color: #e6e6e6;
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
      }
      h2 {
        font-size: 1.15rem;
        margin-top: 1.5rem;
      }
      section {
        margin: 1rem 0;
        padding: 0.75rem;
        border: 1px solid #333;
        border-radius: 8px;
      }
      button {
        margin: 0.2rem;
        padding: 0.4rem 0.7rem;
        background: #222;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #8ab4ff;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .panic {
        background: #5a1414;
        border-color: #a33;
      }
      .muted {
        color: #aaa;
      }
      .warn {
        color: #ffb366;
      }
      .step {
        font-size: 1.1rem;
        color: #9fd;
      }
      .worlds {
        display: flex;
        flex-wrap: wrap;
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 0.2rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        text-align: left;
        white-space: nowrap;
      }
      label {
        display: block;
        margin: 0.4rem 0;
      }
      pre {
        background: #000;
        padding: 0.6rem;
        border: 1px solid #333;
        white-space: pre-wrap;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.3rem 0;
      }
      .bar span {
        width: 3rem;
      }
      .track {
        position: relative;
        flex: 1;
        height: 14px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: #3c9;
      }
      .fill.hot {
        background: #e44;
      }
      .hold {
        position: absolute;
        top: 0;
        width: 2px;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/soundCheck/main.tsx"></script>
  </body>
</html>
