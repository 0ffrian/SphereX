# Targets for the pre-fetch script (D-25) and the recorded test fixtures.
# `query` is what is sent to /v1/resolve; `aliases` are short names that SIMBAD does not know
# (ASSUMPTION: a name mapping, not a physical value).
# Demo objects (D-31) are listed last, with group = "demo".

[[target]]
name = "Barnard's Star"
query = "Barnard's star"
group = "test"
aliases = []

[[target]]
name = "Epsilon Indi B"
query = "eps Ind B"
group = "test"
aliases = []

[[target]]
name = "WISE 0855"
query = "WISE J085510.83-071442.5"
group = "test"
aliases = ["WISE 0855", "WISE 0855-0714"]

[[target]]
name = "RW Aurigae"
query = "RW Aur"
group = "test"
aliases = []

[[target]]
name = "R Draconis"
query = "R Dra"
group = "test"
aliases = []

# A moving object, so the SBDB + Horizons path and the moving-object path search (issue #26,
# Q-21) are recorded and tested offline.
[[target]]
name = "433 Eros"
query = "433 Eros"
group = "fixture"
aliases = []

# Demo objects (D-31): unsaturated, so SPHEREx gives them measured spectra.
[[target]]
name = "SIMP 0136"
query = "SIMP J013656.5+093347.3"
group = "demo"
aliases = ["SIMP 0136+0933", "SIMP J0136+0933"]

[[target]]
name = "TWA 27"
query = "TWA 27"
group = "demo"
aliases = ["2M1207", "2M1207 A", "2M1207A"]

[[target]]
name = "IRAS 04302+2247"
query = "IRAS 04302+2247"
group = "demo"
aliases = ["IRAS 04302"]
