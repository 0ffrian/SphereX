# Targets for the pre-fetch script (D-25) and the recorded test fixtures.
# `query` is what is sent to /v1/resolve; `aliases` are short names that SIMBAD does not know
# (ASSUMPTION: a name mapping, not a physical value).
# Demo objects (D-31) are listed last, with group = "demo".

[[target]]
name = "Barnard's Star"
query = "Barnard's star"
group = "test"
aliases = ["barnard", "barnards"]

[[target]]
name = "Epsilon Indi B"
query = "eps Ind B"
group = "test"
aliases = ["eps indi b", "epsilon indi"]

[[target]]
name = "WISE 0855"
query = "WISE J085510.83-071442.5"
group = "test"
aliases = ["WISE 0855", "WISE 0855-0714", "w0855"]

[[target]]
name = "RW Aurigae"
query = "RW Aur"
group = "test"
aliases = ["rw aur"]

[[target]]
name = "R Draconis"
query = "R Dra"
group = "test"
aliases = ["r dra"]

# A moving object, so the SBDB + Horizons path and the moving-object path search (issue #26,
# Q-21) are recorded and tested offline.
[[target]]
name = "433 Eros"
query = "433 Eros"
group = "fixture"
aliases = []

# Moving targets with their own path-search windows (issue #26, PR #53): `moving_windows`
# replaces SX_MOVING_WINDOW_START/END, so the cone cap covers only the spans where SPHEREx saw
# the body. Matched by `spkid` (the SBDB id), so every spelling of the name gets the same windows.
# 3I/ATLAS: SBDB answers "3I" with C/2025 N1 (ATLAS), spkid 1004083 (checked 9 Nov 2026). QR2
# has its frames for 2025-08-01 to 08-16 and 2025-12-08 to 12-15 UTC (A3.1); each window is
# padded by one day either side. Its row is with the demo targets below: one name, one query
# (PR #70). Group "demo" is recorded by `scripts.record_fixtures`, so use --only to skip this long
# path search.

# Exoplanet fixtures (Q-63, A3.8): one per kind the rule gives, plus the envelope refusal, with
# `frames = false` so only the SIMBAD and Exoplanet Archive answers are recorded (no SPHEREx
# frames: the card then has a null spectrum with a reason). Classes under the Q-63 rule, on
# since issue #68 (Moon's sign-off, 9 Nov 2026; tests: test_exoplanets.py LIVE_TYPES):
# TRAPPIST-1 e R 0.92 -> planet_rocky; K2-18 b R 2.37, M 8.92 -> planet_water;
# HD 209458 b R 15.58 -> gas_giant; GJ 1214 b R 2.73, M 8.41 -> candidate (envelope).
# Archive "Calculated Value" radii (refstr=CALCULATED_VALUE) are never used to classify:
# 51 Peg b calculated R 14.1, true mass -> gas_giant by mass; Proxima Cen b calculated R 1.02,
# Msini mass -> candidate (type:exoplanet_radius).
[[target]]
name = "TRAPPIST-1 e"
query = "TRAPPIST-1 e"
group = "demo"  # also search row 12 (Q-161); frames = false keeps it out of the frame pre-fetch
frames = false
aliases = ["TRAPPIST-1e"]

[[target]]
name = "K2-18 b"
query = "K2-18 b"
group = "demo"  # also search row 13 (Q-161)
frames = false
aliases = ["K2-18", "K218"]

[[target]]
name = "HD 209458 b"
query = "HD 209458 b"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "GJ 1214 b"
query = "GJ 1214 b"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "51 Peg b"
query = "51 Peg b"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "Proxima Cen b"
query = "Proxima Cen b"
group = "fixture"
frames = false
aliases = []

