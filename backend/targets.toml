# Targets for the pre-fetch script (D-25) and the recorded test fixtures.
# `query` is what is sent to /v1/resolve; `aliases` are short names that SIMBAD does not know
# (ASSUMPTION: a name mapping, not a physical value).
# Demo objects: add them below with group = "demo" once the team picks them.

[[target]]
name = "Barnard's Star"
query = "Barnard's star"
group = "test"
aliases = []

[[target]]
name = "Epsilon Indi B"
query = "eps Ind B"
group = "test"
aliases = []

[[target]]
name = "WISE 0855"
query = "WISE J085510.83-071442.5"
group = "test"
aliases = ["WISE 0855", "WISE 0855-0714"]

[[target]]
name = "RW Aurigae"
query = "RW Aur"
group = "test"
aliases = []

[[target]]
name = "R Draconis"
query = "R Dra"
group = "test"
aliases = []

# A moving object, so the SBDB + Horizons path and the moving-object refusal (Q-21) are
# recorded and tested offline.
[[target]]
name = "433 Eros"
query = "433 Eros"
group = "fixture"
aliases = []

# Exoplanet fixtures (Q-63, A3.8): one per kind the rule gives, plus the envelope refusal, with
# `frames = false` so only the SIMBAD and Exoplanet Archive answers are recorded (no SPHEREx
# frames: the card then has a null spectrum with a reason). Classes under the Q-63 rule:
# TRAPPIST-1 e R 0.92 -> planet_rocky; K2-18 b R 2.37, M 8.92 -> planet_water;
# HD 209458 b R 15.58 -> gas_giant; GJ 1214 b R 2.73, M 8.41 -> candidate (envelope).
[[target]]
name = "TRAPPIST-1 e"
query = "TRAPPIST-1 e"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "K2-18 b"
query = "K2-18 b"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "HD 209458 b"
query = "HD 209458 b"
group = "fixture"
frames = false
aliases = []

[[target]]
name = "GJ 1214 b"
query = "GJ 1214 b"
group = "fixture"
frames = false
aliases = []
