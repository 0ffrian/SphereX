[project]
name = "shift-spectrum-backend"
version = "0.1.0"
description = "Shift & Spectrum API: SPHEREx frames, cutouts and data adapters (FastAPI, D-15)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
    "astropy==8.0.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "datamodel-code-generator==0.89.0",
    "jsonschema==4.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::astropy.wcs.FITSFixedWarning",
    # starlette 1.10 TestClient deprecates httpx in favour of httpx2; the API is unchanged.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated (D-18): schema descriptions become long strings that the formatter cannot split.
"app/contract/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["astropy.*"]
ignore_missing_imports = true
