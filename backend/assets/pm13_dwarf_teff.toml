# Mean dwarf (main-sequence) effective temperatures by spectral type, for pipeline stage 4's third
# star-Teff source (Q-152, issue #68 Part 8c). Read-only reviewed config, like literature.toml.
#
# Source: Pecaut & Mamajek 2013, ApJS 208, 9, Table 5 ("A Modern Mean Dwarf Stellar Color and
# Effective Temperature Sequence"), values from the author's updated online version 2022.04.16:
# http://www.pas.rochester.edu/~emamajek/EEM_dwarf_UBVIJHK_colors_Teff.txt (Teff column, rows O9V
# to M9V, which are the rows of Table 5; the online file adds O3-O8 and L, T, Y rows that are not
# used). Dwarfs only: this table does not apply to giants, Miras or pre-main-sequence stars
# (PM13: pre-main-sequence stars are about 250 K cooler for G5 to K6), and no radius is read from it.
# Tag when used: inferred_from_analog (a typical value for the class, not a measurement).

source = "Pecaut & Mamajek 2013, ApJS 208, 9, Table 5 (updated online version 2022.04.16)"

