# --- Star rotation periods (issue #93 section 5 C) ---------------------------------------------
# Without a row the frontend borrows the Sun's Rossby number. The card field is in hours, so each
# period in days is multiplied by 24 (value and err); the note gives the paper's number. Read
# 11 Nov 2026 from the arXiv text.
# Epsilon Eridani: the 11.68 d of Donahue, Saar & Baliunas 1996 (ApJ 466, 384) is quoted by
# Petit et al. 2021 but could not be read in Donahue's own table (ADS scan unreadable here), so the
# TESS value Petit et al. measured, with its uncertainty, is used instead.

[[value]]
key = "simbad-eps-eri"
field = "rot_period_h"
value = 278.88
err = 3.6
tag = "measured"
citation = "Petit et al. 2021, A&A 648, A55 (arXiv:2101.02643)"
